[package]
name = "rust-file-assistant"
version = "1.0.0"
edition = "2021"
authors = ["File Assistant"]
description = "A cross-platform GUI file management tool built with Rust and egui"
license = "MIT"

[[bin]]
name = "file-assistant"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
walkdir = "2.4"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.1"
rfd = "0.14"
humansize = "2.1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "File Assistant"
identifier = "com.rust.file-assistant"
icon = []
version = "1.0.0"
copyright = "MIT License"
category = "Utility"
short_description = "Rust GUI File Management Tool"
long_description = "A powerful cross-platform file management assistant with GUI"
